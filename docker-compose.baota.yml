services:
  app:
    image: ${VOZEB_PRO_IMAGE:-ghcr.io/csyqlz/vozeb-pro:latest}
    container_name: vozeb-pro
    network_mode: host
    env_file:
      - .env
    volumes:
      - vozeb-pro-data:/app/web/.data
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      VOZEB_PRO_DATA_DIR: /app/web/.data
      VOZEB_PRO_INTERNAL_ORIGIN: http://127.0.0.1:3000
      VOZEB_PRO_DATABASE_PROVIDER: postgres
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中配置 DATABASE_URL}
      VOZEB_PRO_DATABASE_POOL_MAX: ${VOZEB_PRO_DATABASE_POOL_MAX:-10}
      VOZEB_PRO_DATABASE_SSL: ${VOZEB_PRO_DATABASE_SSL:-0}
      VOZEB_PRO_ENCRYPTION_KEY: ${VOZEB_PRO_ENCRYPTION_KEY:?请在 .env 中配置 VOZEB_PRO_ENCRYPTION_KEY}
      VOZEB_PRO_TRUSTED_PROXY_HOPS: ${VOZEB_PRO_TRUSTED_PROXY_HOPS:-1}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  vozeb-pro-data:
