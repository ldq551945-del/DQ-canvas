services:
  app:
    image: ghcr.io/dao-qin/dq:latest
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - dq-data:/app/web/.data
    environment:
      NODE_OPTIONS: "--max-old-space-size=384"
      UV_THREADPOOL_SIZE: "2"
      NEXT_TELEMETRY_DISABLED: "1"
      DQ_DATA_DIR: /app/web/.data
      DQ_INTERNAL_ORIGIN: http://127.0.0.1:3000
      DQ_DATABASE_PROVIDER: postgres
      DATABASE_URL: ${DATABASE_URL:?低内存部署请在 .env 中配置外部 PostgreSQL DATABASE_URL}
      DQ_DATABASE_POOL_MAX: ${DQ_DATABASE_POOL_MAX:-5}
      DQ_DATABASE_SSL: ${DQ_DATABASE_SSL:-1}
      DQ_ENCRYPTION_KEY: ${DQ_ENCRYPTION_KEY:?请在 .env 中配置 DQ_ENCRYPTION_KEY}
      DQ_MAINTENANCE_TOKEN: ${DQ_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
      DQ_REMBG_URL: ${DQ_REMBG_URL:?低内存部署请在 .env 中配置外部 rembg 服务 URL}
      DQ_REMBG_INTERNAL_TOKEN: ${DQ_REMBG_INTERNAL_TOKEN:-}
      DQ_REMBG_MODEL: ${DQ_REMBG_MODEL:-silueta}
      DQ_REMBG_CONCURRENCY: ${DQ_REMBG_CONCURRENCY:-1}
      DQ_REMBG_TIMEOUT_SECONDS: ${DQ_REMBG_TIMEOUT_SECONDS:-120}
    mem_limit: 512m
    memswap_limit: 768m
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const base=process.env.DQ_REMBG_URL;const rembgUrl=base.endsWith('/')?base+'readyz':base+'/readyz';Promise.all([fetch('http://127.0.0.1:3000/api/health/live'),fetch(rembgUrl)]).then(([app,rembg])=>{if(!app.ok||!rembg.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  generation-worker:
    image: ghcr.io/dao-qin/dq:latest
    command: ["node", "/app/web/scripts/generation-worker.mjs"]
    env_file:
      - .env
    environment:
      NODE_OPTIONS: "--max-old-space-size=64"
      DQ_WORKER_API_ORIGIN: http://app:3000
      DQ_MAINTENANCE_TOKEN: ${DQ_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 96m
    memswap_limit: 128m
    restart: unless-stopped

volumes:
  dq-data:
