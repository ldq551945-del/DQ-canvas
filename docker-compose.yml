services:
  postgres:
    image: postgres:16-alpine
    container_name: dq-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dq}
      POSTGRES_USER: ${POSTGRES_USER:-dq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
    volumes:
      - dq-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dq} -d ${POSTGRES_DB:-dq}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: ${DQ_IMAGE:-ghcr.io/dao-qin/dq:latest}
    container_name: dq
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - dq-data:/app/web/.data
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      DQ_DATA_DIR: /app/web/.data
      DQ_INTERNAL_ORIGIN: http://127.0.0.1:3000
      DQ_DATABASE_PROVIDER: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-dq}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dq}
      DQ_DATABASE_POOL_MAX: ${DQ_DATABASE_POOL_MAX:-10}
      DQ_DATABASE_SSL: "0"
      DQ_ENCRYPTION_KEY: ${DQ_ENCRYPTION_KEY:?请在 .env 中配置 DQ_ENCRYPTION_KEY}
      DQ_MAINTENANCE_TOKEN: ${DQ_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
      DQ_REMBG_URL: ${DQ_REMBG_URL:-http://rembg:7000}
      DQ_REMBG_INTERNAL_TOKEN: ${DQ_REMBG_INTERNAL_TOKEN:-}
      DQ_REMBG_MODEL: ${DQ_REMBG_MODEL:-silueta}
      DQ_REMBG_CONCURRENCY: ${DQ_REMBG_CONCURRENCY:-1}
      DQ_REMBG_TIMEOUT_SECONDS: ${DQ_REMBG_TIMEOUT_SECONDS:-120}
    depends_on:
      postgres:
        condition: service_healthy
      rembg:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  rembg:
    image: ${DQ_REMBG_IMAGE:-ghcr.io/dao-qin/dq-rembg:latest}
    container_name: dq-rembg
    env_file:
      - .env
    environment:
      DQ_REMBG_MODEL: ${DQ_REMBG_MODEL:-silueta}
      DQ_REMBG_CONCURRENCY: ${DQ_REMBG_CONCURRENCY:-1}
      DQ_REMBG_ALPHA_MATTING_TILE_PIXELS: ${DQ_REMBG_ALPHA_MATTING_TILE_PIXELS:-1048576}
      DQ_REMBG_TIMEOUT_SECONDS: ${DQ_REMBG_TIMEOUT_SECONDS:-120}
      DQ_REMBG_QUEUE_TIMEOUT_SECONDS: ${DQ_REMBG_QUEUE_TIMEOUT_SECONDS:-30}
      DQ_REMBG_INTERNAL_TOKEN: ${DQ_REMBG_INTERNAL_TOKEN:-}
      DQ_REMBG_OMP_NUM_THREADS: ${DQ_REMBG_OMP_NUM_THREADS:-2}
      DQ_REMBG_ONNX_INTER_OP_THREADS: ${DQ_REMBG_ONNX_INTER_OP_THREADS:-1}
      OMP_NUM_THREADS: ${DQ_REMBG_OMP_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${DQ_REMBG_OMP_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${DQ_REMBG_OMP_NUM_THREADS:-2}
    cpus: "${DQ_REMBG_CPUS:-2.0}"
    mem_limit: "${DQ_REMBG_MEMORY_LIMIT:-5g}"
    deploy:
      resources:
        limits:
          cpus: "${DQ_REMBG_CPUS:-2.0}"
          memory: "${DQ_REMBG_MEMORY_LIMIT:-5g}"
    expose:
      - "7000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/readyz', timeout=3)",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  generation-worker:
    image: ${DQ_IMAGE:-ghcr.io/dao-qin/dq:latest}
    container_name: dq-generation-worker
    command: ["node", "/app/web/scripts/generation-worker.mjs"]
    env_file:
      - .env
    environment:
      DQ_WORKER_API_ORIGIN: http://app:3000
      DQ_MAINTENANCE_TOKEN: ${DQ_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dq-data:
  dq-postgres:
