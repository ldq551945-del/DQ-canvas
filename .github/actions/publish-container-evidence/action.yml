name: Publish container release evidence
description: Verify, sign, attest, and archive an immutable container image release.

inputs:
  image-name:
    description: Fully qualified container image name.
    required: true
  image-digest:
    description: Published OCI manifest digest.
    required: true
  artifact-name:
    description: GitHub artifact name for the release evidence bundle.
    required: true

runs:
  using: composite
  steps:
    - name: Verify published digest
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        IMAGE_DIGEST: ${{ inputs.image-digest }}
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        set -euo pipefail
        if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
          echo "Invalid image digest: $IMAGE_DIGEST" >&2
          exit 1
        fi

        image_ref="${IMAGE_NAME}@${IMAGE_DIGEST}"
        resolved_digest="$(docker buildx imagetools inspect "$image_ref" --format '{{.Manifest.Digest}}')"
        test "$resolved_digest" = "$IMAGE_DIGEST"

        evidence_dir="$RUNNER_TEMP/$ARTIFACT_NAME"
        mkdir -p "$evidence_dir"
        printf '%s\n' "$image_ref" > "$evidence_dir/image-reference.txt"
        docker buildx imagetools inspect "$image_ref" --raw > "$evidence_dir/manifest.json"
        jq -n \
          --arg image "$IMAGE_NAME" \
          --arg digest "$IMAGE_DIGEST" \
          --arg reference "$image_ref" \
          --arg repository "$GITHUB_REPOSITORY" \
          --arg revision "$GITHUB_SHA" \
          --arg sourceRef "$GITHUB_REF" \
          --arg workflowRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          '{schemaVersion: 1, image: $image, digest: $digest, immutableReference: $reference, sourceRepository: $repository, sourceRevision: $revision, sourceRef: $sourceRef, workflowRun: $workflowRun}' \
          > "$evidence_dir/release.json"

    - name: Generate SPDX SBOM
      uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        image: ${{ inputs.image-name }}@${{ inputs.image-digest }}
        format: spdx-json
        output-file: ${{ runner.temp }}/${{ inputs.artifact-name }}/sbom.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Sign immutable image reference
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-name }}@${{ inputs.image-digest }}
      run: cosign sign --yes "$IMAGE_REF"

    - name: Verify keyless signature
      shell: bash
      env:
        EVIDENCE_FILE: ${{ runner.temp }}/${{ inputs.artifact-name }}/cosign-verification.json
        IMAGE_REF: ${{ inputs.image-name }}@${{ inputs.image-digest }}
      run: |
        cosign verify \
          --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*@refs/(heads|tags)/.*$" \
          --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
          "$IMAGE_REF" > "$EVIDENCE_FILE"

    - name: Attest build provenance
      id: provenance
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-name: ${{ inputs.image-name }}
        subject-digest: ${{ inputs.image-digest }}
        push-to-registry: true

    - name: Complete evidence bundle
      shell: bash
      env:
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        ATTESTATION_URL: ${{ steps.provenance.outputs.attestation-url }}
      run: |
        set -euo pipefail
        evidence_dir="$RUNNER_TEMP/$ARTIFACT_NAME"
        cp "$ATTESTATION_BUNDLE" "$evidence_dir/provenance.sigstore.json"
        printf '%s\n' "$ATTESTATION_URL" > "$evidence_dir/attestation-url.txt"
        cd "$evidence_dir"
        sha256sum attestation-url.txt cosign-verification.json image-reference.txt manifest.json provenance.sigstore.json release.json sbom.spdx.json > checksums.txt

    - name: Upload release evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}
        if-no-files-found: error
        retention-days: 90
