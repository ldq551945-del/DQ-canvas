services:
  - type: web
    name: dq
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    healthCheckPath: /api/health/live
    disk:
      name: dq-data
      mountPath: /app/web/.data
      sizeGB: 10
    envVars:
      - fromGroup: dq-runtime
      - key: PORT
        value: 3000
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: UV_THREADPOOL_SIZE
        value: "2"
      - key: DQ_DATA_DIR
        value: /app/web/.data
      - key: DQ_INTERNAL_ORIGIN
        value: http://127.0.0.1:3000
      - key: DQ_DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: dq-postgres
          property: connectionString
      - key: DQ_DATABASE_POOL_MAX
        value: "5"
      - key: DQ_DATABASE_SSL
        value: "1"
      - key: DQ_ENCRYPTION_KEY
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_TLDRAW_LICENSE_KEY
        sync: false

  - type: worker
    name: dq-generation-worker
    runtime: docker
    plan: starter
    autoDeployTrigger: off
    dockerCommand: node /app/web/scripts/generation-worker.mjs
    envVars:
      - fromGroup: dq-runtime
      - key: NODE_OPTIONS
        value: --max-old-space-size=128
      - key: DQ_WORKER_API_ORIGIN
        fromService:
          name: dq
          type: web
          property: hostport

databases:
  - name: dq-postgres
    plan: basic-256mb
    databaseName: dq
    user: dq

envVarGroups:
  - name: dq-runtime
    envVars:
      - key: DQ_MAINTENANCE_TOKEN
        generateValue: true
