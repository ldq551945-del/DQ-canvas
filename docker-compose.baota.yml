services:
  app:
    image: ${DQ_IMAGE:-ghcr.io/ldq551945-del/dq:latest}
    container_name: dq
    network_mode: host
    env_file:
      - .env
    volumes:
      - dq-data:/app/web/.data
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      DQ_DATA_DIR: /app/web/.data
      DQ_INTERNAL_ORIGIN: http://127.0.0.1:3000
      DQ_DATABASE_PROVIDER: postgres
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中配置 DATABASE_URL}
      DQ_DATABASE_POOL_MAX: ${DQ_DATABASE_POOL_MAX:-10}
      DQ_DATABASE_SSL: ${DQ_DATABASE_SSL:-0}
      DQ_ENCRYPTION_KEY: ${DQ_ENCRYPTION_KEY:?请在 .env 中配置 DQ_ENCRYPTION_KEY}
      DQ_MAINTENANCE_TOKEN: ${DQ_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
      DQ_TRUSTED_PROXY_HOPS: ${DQ_TRUSTED_PROXY_HOPS:-1}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  generation-worker:
    image: ${DQ_IMAGE:-ghcr.io/ldq551945-del/dq:latest}
    container_name: dq-generation-worker
    network_mode: host
    command: ["node", "/app/web/scripts/generation-worker.mjs"]
    env_file:
      - .env
    environment:
      DQ_WORKER_API_ORIGIN: http://127.0.0.1:3000
      DQ_MAINTENANCE_TOKEN: ${DQ_MAINTENANCE_TOKEN:?请在 .env 中配置至少 32 位维护令牌}
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dq-data:
